services:
  backend:
    image: soham5492/secure-alumni-backend:latest
    container_name: secure-alumni-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:8080
      DEMO_CAPTCHA_TOKEN: demo-pass
    expose:
      - "5000"

  frontend:
    image: soham5492/secure-alumni-frontend:latest
    container_name: secure-alumni-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"